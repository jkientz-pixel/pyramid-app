name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [master]
  pull_request:

jobs:
  preflight:
    name: Data validator (preflight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib unittest, no network: which listed clubs become youth pins, and
      # where a name-joined location is allowed to land.
      - name: Youth directory placement tests
        run: python3 -m unittest scripts/test_youth_dedupe.py
      # about/faq/terms/us-soccer-pyramid and the two rankings pages are
      # generated, not committed (see .gitignore), and preflight asserts on
      # them. deploy.sh generates before it runs preflight for the same reason.
      # Doing it here too means the gate checks what actually ships rather than
      # a committed copy that goes stale the moment js/data.js moves.
      # Stdlib only, so no pip install step is needed.
      - name: Generate the pages preflight asserts on
        run: python3 scripts/gen_seo_pages.py
      # lib/club_domains.json is also gitignored (regenerated on every deploy)
      # and preflight runs gen_club_domains.py --check against it.
      - name: Generate the club domain map preflight checks
        run: python3 scripts/gen_club_domains.py
      # preflight rejects any fixture dated before today, and the committed
      # schedule only advances when refresh-rosters commits. Every push made
      # after a night of games therefore failed here (three red runs on
      # 2026-09-17) even though the deploy job passes — it runs this same
      # fallback first, which restores the committed trio minus played games.
      - name: Prune played fixtures from the committed season race
        run: python3 scripts/race_gate.py --fallback
      - name: Run preflight gate
        run: python3 scripts/preflight.py

  smoke:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    # the suite finishes in ~2-4 min; a wedged apt mirror once held the
    # browser-install step open for the full 6h Actions ceiling (2026-08-18)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      # club/, league/ and state/ are generated, not committed (see .gitignore).
      # The SEO specs assert on them, and running the generators here is also
      # the only CI coverage they get. gen_og_cards.py is skipped: it needs
      # Pillow, and club pages fall back to the site-wide og.png without it.
      - name: Generate the static page tree
        run: |
          python3 scripts/gen_seo_pages.py
          python3 scripts/gen_club_pages.py
      - name: Run smoke tests
        run: npm test
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  preflight:
    name: Data validator (preflight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run preflight gate
        run: python3 scripts/preflight.py

      # the roster bot deploys and bumps the cache-bust token on master twice
      # a day, so any branch more than a few hours old carries a token master
      # already shipped. Merging that serves returning browsers the build they
      # cached under it — the change looks deployed and nobody sees it.
      - name: Cache-bust token must be ahead of master
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin master:refs/remotes/origin/master
          python3 scripts/check_token_ahead.py

  smoke:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    # the suite finishes in ~2-4 min; a wedged apt mirror once held the
    # browser-install step open for the full 6h Actions ceiling (2026-08-18)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm test
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

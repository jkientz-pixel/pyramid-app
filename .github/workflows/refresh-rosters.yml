name: Refresh rosters
on:
  schedule:
    # twice daily; GitHub cron is best-effort, so odd minutes dodge the
    # top-of-hour rush where scheduled runs get delayed or dropped
    - cron: '17 2,14 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
env:
  # both Cloudflare secrets must exist for the auto-deploy step to run;
  # without them the workflow still commits data and the site updates on
  # the next manual ./deploy.sh
  CF_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
jobs:
  refresh:
    runs-on: ubuntu-latest
    # normal run is ~3-4 min even with scrape retries; don't let a wedged
    # mirror or source hold a runner for the 6h Actions ceiling
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh_rosters.py
      - run: python scripts/fetch_asa.py
      - run: python scripts/fetch_asa_games.py
      # fixtures carry a rolling three-week horizon, so they go stale on their
      # own — this is the step that keeps #/matches answering "when do they
      # play". It exits non-zero if every feed errors, so an ESPN block fails
      # the run instead of quietly publishing an empty schedule.
      - run: python scripts/fetch_fixtures.py
      # Season Race inputs: current standings, the schedule still to come, and
      # each league's real season window. Same ESPN host and the same plain-UA
      # rule as fixtures; it exits non-zero only if EVERY feed fails, so one
      # league going quiet does not fail the run. Runs after fixtures so a
      # rate-limited ESPN shows up on the fixtures step first, where the
      # failure is more obvious.
      - run: python scripts/fetch_race.py
      # a broken scrape must never silently publish stale or empty data:
      # the gate diffs the fresh files against HEAD and fails on collapse
      - name: Gate — refuse empty or shrunken data
        run: python scripts/verify_refresh.py
      # Rotate the weekly rank snapshot BEFORE the commit, because the commit
      # is the only step in this pipeline that persists a file. deploy.sh runs
      # the generators against a throwaway tree, so a snapshot written there
      # would vanish and every club page would show "no movement" forever.
      # The script is time-gated: it no-ops until the snapshot is 6 days old.
      - name: Rotate weekly rank snapshot
        run: python scripts/snapshot_ranks.py
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "roster-bot"
          git config user.email "actions@github.com"
          git add js/rosters.js js/data.js data/wire_asa.json data/fixtures.json data/fixtures_unmatched.json data/rank_snapshot.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: scheduled roster refresh" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true' && env.CF_DEPLOY == 'true'
        with:
          node-version: '22'
      # deploy.sh is the single deploy path (bump ?v= token so returning
      # browsers refetch, preflight, stage ONLY runtime assets — the raw
      # scrape dumps with player PII never leave the repo)
      - name: Deploy refreshed data to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CF_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./deploy.sh
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create scrape-failure -c B60205 -d "Scheduled data refresh failed" -R "${{ github.repository }}" 2>/dev/null || true
          existing=$(gh issue list -R "${{ github.repository }}" --label scrape-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "${{ github.repository }}" --body "Roster refresh failed again: $url"
          else
            gh issue create -R "${{ github.repository }}" \
              --title "Roster refresh failed $(date -u +%F)" \
              --label scrape-failure \
              --body "The scheduled roster refresh failed. Run: $url — nothing was committed; the site keeps serving the last good data. Check scripts/refresh_rosters.py / fetch_asa.py / fetch_asa_games.py / fetch_fixtures.py and the verify_refresh.py gate output in the run log."
          fi
